name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go version
      - run: make build
      - run: make test
      - run: make lint-lane-ids
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          args: --max-issues-per-linter=0 --max-same-issues=0
      - run: make vuln
