stages:
  - test
  - ai-review

test:
  stage: test
  image: golang:1.25-alpine
  script:
    - go build ./...
    - go test -count=1 ./...
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

mrinspect:
  stage: ai-review
  image:
    name: ghcr.io/twjohnwu/mrinspect:v0.2.0
    entrypoint: [""]
  script:
    - mrinspect
  variables:
    AI_PROVIDER: openai
    AI_PROVIDER_KEY: $AI_PROVIDER_KEY
    GITLAB_TOKEN: $GITLAB_TOKEN
    PROJECTS_DIR: /app/projects
    MRI_SERVICE_NAME: mrinspect
    MRI_SERVICE_TYPE: backend
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "trigger"'

index:
  stage: ai-review
  image: golang:1.25-alpine
  script:
    - go build -o mrinspect ./cmd/mrinspect
    - mkdir -p rag-index
    - ./mrinspect index --out rag-index/mrinspect-rag.sqlite
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
      changes:
        - projects/_shared/**/*
        - projects/margherita-pizza/**/*
        - projects/fried-chicken/**/*
    - when: manual
      allow_failure: true
  artifacts:
    paths:
      - rag-index/mrinspect-rag.sqlite
    expire_in: 21 days
